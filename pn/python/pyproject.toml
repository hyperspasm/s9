[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pn"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["betterproto>=2.0.0b7"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "websockets"]
# Generators run by proto/generate.sh: nanopb (protobuf, protoc) and betterproto
codegen = ["protobuf", "grpcio-tools", "betterproto[compiler]"]

[project.scripts]
pn-manifest = "pn.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pn"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
