[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "s9-validation"
version = "0.0.0"
description = "Numeric reference oracles and golden-table generation for s9's DSP"
requires-python = ">=3.9"
dependencies = ["numpy>=1.20"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/s9"]
